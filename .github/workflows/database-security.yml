name: Database Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  database-security:
    name: Database Security (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8.0', 'mariadb:11.8']
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: fixture
          MYSQL_DATABASE: localwp_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent -uroot -pfixture || mariadb-admin ping --silent -uroot -pfixture"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify database-enforced read-only behavior
        run: npm run test:integration
        env:
          DB_TEST_PORT: ${{ job.services.database.ports[3306] }}
